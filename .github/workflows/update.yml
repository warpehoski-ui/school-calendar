name: Build and deploy

on:
  schedule:
    - cron: "0 13 * * *"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar recurring-ical-events tzdata
      - name: Download school calendar
        run: curl -fL -o basic.ics "https://calendar.google.com/calendar/ical/wnsk8.com_4gk29dm9gdovm9n2k4r6ulqi00%40group.calendar.google.com/public/basic.ics"
      - name: Build calendar files
        run: python filter_calendar.py
      - name: Add web app
        run: cp index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
